name: verify

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]
        rails: ["7.1", "7.2", "8.0"]
        pgvector: ["present", "absent"]
        exclude:
          - ruby: "3.1"
            rails: "8.0"
          - ruby: "3.2"
            rails: "8.0"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/agentkit_test
      RAILS_VERSION: ${{ matrix.rails }}
      AGENTKIT_PGVECTOR: ${{ matrix.pgvector }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake verify
